name: Companion checks and Windows test build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: npm exec playwright install -- --with-deps chromium
      - run: npm run test:ui
      - run: HEADED=1 xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seatmates-windows-test
          path: |
            build/*-windows-test.zip
            build/*-windows-test.zip.sha256
