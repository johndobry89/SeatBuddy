name: SeatBuddies Integration Forge checks and Chrome test build
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - if: runner.os == 'Linux'
        run: npm exec playwright install -- --with-deps chromium
      - name: Install Chromium on macOS
        if: runner.os == 'macOS'
        run: |
          if ! npm exec playwright install -- chromium; then
            echo "::warning::Chromium installation failed; retrying this idempotent download once."
            npm exec playwright install -- chromium
          fi
      - run: npm run test:ui
      - if: runner.os == 'Linux'
        run: HEADED=1 xvfb-run -a npm run test:e2e
      - name: Native Chrome smoke on macOS Intel
        if: runner.os == 'macOS'
        run: HEADED=1 npm run test:smoke:chrome
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Linux'
        with:
          name: seatbuddies-chrome-test
          path: |
            build/*-chrome-test.zip
            build/*-chrome-test.zip.sha256
